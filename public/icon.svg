<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Luxury Dark Blue/Slate) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Glowing Yellow/Gold Accent -->
    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Glass Windshield Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Subtle Radial Aura -->
    <radialGradient id="glowAura" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Soft Glow & Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="carShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- iOS / Android Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <!-- Ambient Glow Behind Car -->
  <circle cx="256" cy="220" r="180" fill="url(#glowAura)" />

  <!-- Modern Subtle Metallic Outer Border -->
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Road / Motion Base Horizon -->
  <ellipse cx="256" cy="335" rx="150" ry="18" fill="#000000" fill-opacity="0.6" filter="blur(8px)" />
  <path d="M 120 330 Q 256 342 392 330" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.4" fill="none" />

  <!-- ================= LUXURY MODERN TAXI CAR ================= -->
  <g filter="url(#carShadow)">
    <!-- 1. TAXI ROOF LIGHT (SIGN) -->
    <path d="M 226 128 L 286 128 L 294 140 L 218 140 Z" fill="url(#goldGrad)" />
    <text x="256" y="137" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" text-anchor="middle" fill="#0f172a" letter-spacing="1">TAXI</text>
    <circle cx="256" cy="134" r="14" fill="#fbbf24" fill-opacity="0.2" filter="blur(3px)" />

    <!-- 2. CAR ROOF & PILLARS -->
    <path d="M 194 186 C 204 154, 222 144, 256 144 C 290 144, 308 154, 318 186 Z" fill="url(#carBodyGrad)" stroke="url(#goldGrad)" stroke-width="2" />
    
    <!-- 3. WINDSHIELD (FRONT GLASS) -->
    <path d="M 200 184 L 214 154 C 220 150, 234 148, 256 148 C 278 148, 292 150, 298 154 L 312 184 Z" fill="url(#glassGrad)" stroke="#334155" stroke-width="1.5" />
    <!-- Windshield Reflection -->
    <path d="M 218 156 L 246 156 L 230 182 L 208 182 Z" fill="#ffffff" fill-opacity="0.18" />

    <!-- 4. CAR SIDE MIRRORS -->
    <ellipse cx="160" cy="204" rx="14" ry="9" fill="url(#carBodyGrad)" stroke="url(#goldGrad)" stroke-width="2" />
    <ellipse cx="352" cy="204" rx="14" ry="9" fill="url(#carBodyGrad)" stroke="url(#goldGrad)" stroke-width="2" />
    <ellipse cx="162" cy="204" rx="9" ry="6" fill="#0f172a" />
    <ellipse cx="350" cy="204" rx="9" ry="6" fill="#0f172a" />

    <!-- 5. MAIN HOOD & FRONT CABIN (DYNAMIC MODERN AERODYNAMIC SHAPE) -->
    <path d="M 170 196 C 182 190, 220 188, 256 188 C 292 188, 330 190, 342 196 C 362 206, 372 230, 368 260 L 360 292 C 358 298, 350 302, 340 302 L 172 302 C 162 302, 154 298, 152 292 L 144 260 C 140 230, 150 206, 170 196 Z" fill="url(#carBodyGrad)" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Hood Character Lines -->
    <path d="M 210 194 L 218 240" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 302 194 L 294 240" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" />

    <!-- 6. FRONT GRILLE (PREMIUM HONEYCOMB/HORIZONTAL SLATS) -->
    <rect x="206" y="246" width="100" height="38" rx="8" fill="#090d16" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Grille Slats -->
    <line x1="214" y1="255" x2="298" y2="255" stroke="#334155" stroke-width="2" />
    <line x1="214" y1="264" x2="298" y2="264" stroke="#334155" stroke-width="2" />
    <line x1="214" y1="273" x2="298" y2="273" stroke="#334155" stroke-width="2" />
    <!-- Emblem on Grille -->
    <circle cx="256" cy="264" r="8" fill="url(#goldGrad)" />
    <circle cx="256" cy="264" r="5" fill="#090d16" />

    <!-- 7. LUXURY LED HEADLIGHTS (ANGULAR & GLOWING) -->
    <!-- Left Headlight -->
    <path d="M 162 230 C 172 230, 192 236, 196 248 C 188 252, 168 252, 156 244 C 154 238, 156 232, 162 230 Z" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="2" filter="url(#goldGlow)" />
    <circle cx="178" cy="242" r="5" fill="#38bdf8" />
    <circle cx="166" cy="240" r="3" fill="#fef08a" />

    <!-- Right Headlight -->
    <path d="M 350 230 C 340 230, 320 236, 316 248 C 324 252, 344 252, 356 244 C 358 238, 356 232, 350 230 Z" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="2" filter="url(#goldGlow)" />
    <circle cx="334" cy="242" r="5" fill="#38bdf8" />
    <circle cx="346" cy="240" r="3" fill="#fef08a" />

    <!-- 8. LOWER BUMPER & WHEEL ACCENTS -->
    <!-- Lower Lip / Splitter -->
    <path d="M 166 294 L 346 294 L 338 308 L 174 308 Z" fill="#020617" stroke="url(#goldGrad)" stroke-width="1.5" />
    <!-- Front Fog/DRL Lights -->
    <rect x="176" y="282" width="22" height="4" rx="2" fill="#38bdf8" filter="url(#goldGlow)" />
    <rect x="314" y="282" width="22" height="4" rx="2" fill="#38bdf8" filter="url(#goldGlow)" />
    
    <!-- Wheels Visible Behind Bumper -->
    <rect x="144" y="278" width="16" height="34" rx="6" fill="#020617" stroke="#334155" stroke-width="1.5" />
    <rect x="352" y="278" width="16" height="34" rx="6" fill="#020617" stroke="#334155" stroke-width="1.5" />
    <!-- Tires tread line -->
    <line x1="148" y1="285" x2="148" y2="305" stroke="#475569" stroke-width="2" />
    <line x1="360" y1="285" x2="360" y2="305" stroke="#475569" stroke-width="2" />
  </g>

  <!-- ================= TYPOGRAPHY & BRANDING ================= -->
  <!-- "كابتن عز" Gold Arabic Calligraphy Typography -->
  <g filter="url(#goldGlow)">
    <text x="256" y="394" font-family="'Cairo', 'Tajawal', 'Segoe UI', system-ui, sans-serif" font-size="46" font-weight="900" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="1.5">
      كابتن عِـز
    </text>
  </g>

  <!-- Sub-label: LUXURY RIDE & DELIVERY -->
  <text x="256" y="428" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#94a3b8" letter-spacing="5">
    CAPTAIN EZZ
  </text>

  <!-- 5 Gold Quality Stars -->
  <g fill="url(#goldGrad)" transform="translate(186, 444) scale(0.7)">
    <polygon points="15,2 19,11 29,11 21,18 24,28 15,22 6,28 9,18 1,11 11,11" />
    <polygon points="45,2 49,11 59,11 51,18 54,28 45,22 36,28 39,18 31,11 41,11" />
    <polygon points="75,2 79,11 89,11 81,18 84,28 75,22 66,28 69,18 61,11 71,11" />
    <polygon points="105,2 109,11 119,11 111,18 114,28 105,22 96,28 99,18 91,11 101,11" />
    <polygon points="135,2 139,11 149,11 141,18 144,28 135,22 126,28 129,18 121,11 131,11" />
  </g>
</svg>
