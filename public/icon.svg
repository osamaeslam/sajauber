<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Canvas with Rounded Squircle (App Icon Style) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Outer Gold Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-opacity="0.4" />
  
  <!-- Glow Circle Behind Icon -->
  <circle cx="256" cy="230" r="160" fill="url(#glowGrad)" />

  <!-- Taxi / Steering Wheel Emblem -->
  <g filter="url(#goldGlow)">
    <!-- Outer Steering Wheel Ring -->
    <circle cx="256" cy="220" r="118" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />
    <circle cx="256" cy="220" r="96" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6 8" stroke-opacity="0.6" />
    
    <!-- Central Taxi Cab Silhouette -->
    <!-- Taxi Roof Light -->
    <path d="M 230 148 L 282 148 L 274 136 L 238 136 Z" fill="url(#goldGrad)" />
    <!-- Taxi Body -->
    <path d="M 194 212 L 206 172 C 208 164, 218 158, 230 158 L 282 158 C 294 158, 304 164, 306 172 L 318 212 C 324 216, 328 224, 328 234 L 328 266 C 328 272, 322 276, 316 276 L 308 276 L 308 286 C 308 292, 300 296, 292 296 L 284 296 C 278 296, 274 292, 274 286 L 274 276 L 238 276 L 238 286 C 238 292, 234 296, 228 296 L 220 296 C 212 296, 204 292, 204 286 L 204 276 L 196 276 C 190 276, 184 272, 184 266 L 184 234 C 184 224, 188 216, 194 212 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round" />
    
    <!-- Taxi Windshield -->
    <path d="M 214 204 L 224 174 C 226 170, 230 168, 236 168 L 276 168 C 282 168, 286 170, 288 174 L 298 204 Z" fill="url(#goldGrad)" fill-opacity="0.85" />
    
    <!-- Headlights -->
    <circle cx="206" cy="242" r="8" fill="#fef08a" />
    <circle cx="306" cy="242" r="8" fill="#fef08a" />
    <rect x="232" y="240" width="48" height="12" rx="4" fill="url(#goldGrad)" />
    
    <!-- Speed/Navigation Wings -->
    <path d="M 112 220 L 150 220" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <path d="M 362 220 L 400 220" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <path d="M 124 242 L 148 242" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.7" />
    <path d="M 364 242 L 388 242" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Luxury Arabic & English Typography Badge -->
  <!-- "كابتن عز" -->
  <text x="256" y="380" font-family="'Cairo', 'Tajawal', 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="900" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="1">
    كابتن عِـز
  </text>
  <!-- Subtitle: CAPTAIN EZZ RIDE -->
  <text x="256" y="420" font-family="'Inter', 'Montserrat', system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#94a3b8" letter-spacing="6">
    CAPTAIN EZZ
  </text>
  
  <!-- Modern 5 Stars Quality Badge -->
  <g fill="url(#goldGrad)" transform="translate(196, 442) scale(0.65)">
    <polygon points="12,2 15,9 23,9 17,14 19,22 12,17 5,22 7,14 1,9 9,9" />
    <polygon points="42,2 45,9 53,9 47,14 49,22 42,17 35,22 37,14 31,9 39,9" />
    <polygon points="72,2 75,9 83,9 77,14 79,22 72,17 65,22 67,14 61,9 69,9" />
    <polygon points="102,2 105,9 113,9 107,14 109,22 102,17 95,22 97,14 91,9 99,9" />
    <polygon points="132,2 135,9 143,9 137,14 139,22 132,17 125,22 127,14 121,9 129,9" />
  </g>
</svg>
